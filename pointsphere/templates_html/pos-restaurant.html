<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Java House POS – PointSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--brand:#7b3f00;--bg:#fdf6ee;--dark:#1a1a1a;--green:#16a34a;--gold:#d97706;--red:#dc2626}
    body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;flex-direction:column}
    .header{background:var(--brand);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
    .header .brand{font-size:20px;font-weight:700}
    .header .sub{font-size:12px;opacity:0.7;margin-top:2px}
    .header .time{font-family:"DM Mono";font-size:15px}
    .body{flex:1;display:flex;align-items:center;justify-content:center;padding:32px}
    .terminal{background:#fff;border-radius:20px;width:100%;max-width:480px;box-shadow:0 8px 40px rgba(0,0,0,0.1);overflow:hidden}
    .terminal-header{background:var(--brand);color:#fff;padding:20px 24px}
    .terminal-header h2{font-size:18px;font-weight:700}
    .terminal-header p{font-size:12px;opacity:0.7;margin-top:3px}
    .terminal-body{padding:24px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:12px;font-weight:600;opacity:0.5;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
    .field input{width:100%;padding:13px 16px;border:1.5px solid #e8d8c8;border-radius:10px;font-size:16px;font-family:"DM Mono";outline:none;transition:border 0.2s}
    .field input:focus{border-color:var(--brand)}
    .lookup-row{display:flex;gap:8px}
    .lookup-row input{flex:1}
    .lookup-btn{padding:13px 18px;background:var(--brand);color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
    .customer-card{background:#fdf3e8;border:1.5px solid #f0d0a8;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:none}
    .customer-card .cname{font-weight:700;font-size:15px;color:var(--brand)}
    .customer-card .cpts{font-size:13px;color:var(--gold);margin-top:3px}
    .pts-preview{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;font-size:13px;color:var(--gold);margin-bottom:16px;text-align:center;display:none}
    .action-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{padding:14px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;transition:opacity 0.15s}
    .btn:hover{opacity:0.88}
    .btn-earn{background:var(--green);color:#fff}
    .btn-redeem{background:var(--gold);color:#fff}
    .btn-clear{background:#fdf3e8;color:#666;font-size:13px;grid-column:span 2;padding:10px}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:50}
    .overlay.show{display:flex}
    .flow-box{background:#fff;border-radius:20px;padding:32px;width:400px}
    .flow-box h3{font-size:17px;font-weight:700;margin-bottom:20px;text-align:center}
    .flow-steps{display:flex;flex-direction:column;gap:10px}
    .fstep{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:#f8fafc;transition:all 0.3s}
    .fstep.active{background:#fdf3e8;border:1.5px solid var(--brand)}
    .fstep.done{background:#f0fdf4;border:1.5px solid var(--green)}
    .fstep .icon{font-size:18px;width:32px;text-align:center}
    .fstep.active .icon{animation:pulse 0.8s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    .fstep .label{font-size:13px;font-weight:600}
    .fstep .detail{font-size:11px;opacity:0.5}
    .receipt-box{background:#fff;border-radius:20px;padding:28px;width:360px;font-family:"DM Mono",monospace}
    .receipt-box .rtitle{text-align:center;font-size:17px;font-weight:700;margin-bottom:3px}
    .receipt-box .rsub{text-align:center;font-size:11px;opacity:0.4;margin-bottom:14px}
    .receipt-box hr{border:none;border-top:1px dashed #ddd;margin:10px 0}
    .rrow{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
    .rpts{text-align:center;padding:14px;background:#fffbeb;border-radius:10px;margin:10px 0}
    .rpts .pval{font-size:28px;font-weight:700;color:var(--gold)}
    .rpts .psub{font-size:12px;opacity:0.6;margin-top:4px}
    .rmeta{text-align:center;font-size:10px;opacity:0.4;margin-top:6px}
    .close-btn{width:100%;padding:13px;background:var(--brand);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;margin-top:16px;font-family:"DM Sans",sans-serif}
  </style>
</head>
<body>
<div class="header">
  <div>
    <div class="brand">☕ Java House</div>
    <div class="sub">PointSphere Partner Terminal</div>
  </div>
  <div class="time" id="clock">--:--:--</div>
</div>
<div class="body">
  <div class="terminal">
    <div class="terminal-header">
      <h2>New Order Transaction</h2>
      <p>Enter customer phone and order amount</p>
    </div>
    <div class="terminal-body">
      <div class="field">
        <label>Customer Phone</label>
        <div class="lookup-row">
          <input id="phone" type="tel" placeholder="7XXXXXXXX" maxlength="9" oninput="resetCustomer()"/>
          <button class="lookup-btn" onclick="lookupCustomer()">Lookup</button>
        </div>
      </div>
      <div class="customer-card" id="custCard">
        <div class="cname" id="custName">—</div>
        <div class="cpts" id="custPts">— pts</div>
      </div>
      <div class="field">
        <label>Order Amount (KSh)</label>
        <input id="amount" type="number" placeholder="e.g. 850" min="1" oninput="updatePreview()"/>
      </div>
      <div class="field">
        <label>POS Reference (optional)</label>
        <input id="posRef" placeholder="e.g. ORD-00456"/>
      </div>
      <div class="pts-preview" id="ptsPreview"></div>
      <div class="action-btns">
        <button class="btn btn-earn" onclick="process('earn')">✓ Earn Points</button>
        <button class="btn btn-redeem" onclick="process('redeem')">★ Redeem Points</button>
        <button class="btn btn-clear" onclick="clearAll()">✕ Clear</button>
      </div>
    </div>
  </div>
</div>
<div class="overlay" id="flowOverlay">
  <div class="flow-box">
    <h3 id="flowTitle">Processing...</h3>
    <div class="flow-steps" id="flowSteps"></div>
  </div>
</div>
<div class="overlay" id="receiptOverlay">
  <div class="receipt-box">
    <div class="rtitle">☕ Java House</div>
    <div class="rsub">PointSphere Partner Receipt</div>
    <hr/>
    <div id="receiptBody"></div>
    <hr/>
    <div class="rpts" id="receiptPts"></div>
    <div class="rmeta" id="receiptMeta"></div>
    <button class="close-btn" onclick="closeReceipt()">New Transaction</button>
  </div>
</div>
<script>
const API="http://127.0.0.1:8000/api";
const STORE="pos_token_restaurant";
const RATE=0.01;
let POS_TOKEN="";
let currentCustomer=null;
window.onload=async()=>{startClock();await loginPartner();};
async function loginPartner(){
  POS_TOKEN=localStorage.getItem(STORE)||"";
  if(POS_TOKEN) return;
  const phone=prompt("Partner phone (9 digits):"); const pin=prompt("Partner PIN:");
  if(!phone||!pin) return;
  const res=await fetch(`${API}/login/`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,pin,role:"partner"})});
  const data=await res.json();
  if(data.token){POS_TOKEN=data.token;localStorage.setItem(STORE,data.token);}
  else alert("Login failed: "+(data.error||"Unknown"));
}
function startClock(){setInterval(()=>{document.getElementById("clock").innerText=new Date().toLocaleTimeString();},1000);}
async function lookupCustomer(){
  const phone=document.getElementById("phone").value.trim();
  if(phone.length!==9) return alert("Phone must be 9 digits");
  try{
    const res=await fetch(`${API}/pos/customer-lookup/?phone=${phone}`,{headers:{"Authorization":POS_TOKEN}});
    const data=await res.json(); if(!res.ok) throw data;
    currentCustomer=data;
    document.getElementById("custName").innerText=data.name;
    document.getElementById("custPts").innerText=data.points.toLocaleString()+" pts";
    document.getElementById("custCard").style.display="block";
    updatePreview();
  }catch(err){alert(err.error||"Customer not found");}
}
function updatePreview(){
  const el=document.getElementById("ptsPreview");
  const amount=parseFloat(document.getElementById("amount").value)||0;
  if(!currentCustomer||amount<=0){el.style.display="none";return;}
  const pts=Math.floor(amount*RATE);
  el.style.display="block";
  el.innerHTML=`<strong>${currentCustomer.name}</strong> will earn <strong>+${pts} pts</strong> on KSh ${amount.toLocaleString()} order`;
}
function resetCustomer(){currentCustomer=null;document.getElementById("custCard").style.display="none";document.getElementById("ptsPreview").style.display="none";}
function clearAll(){document.getElementById("phone").value="";document.getElementById("amount").value="";document.getElementById("posRef").value="";resetCustomer();}
const STEPS=[
  {icon:"🖥",label:"Order Terminal",    detail:"Sending transaction to loyalty backend"},
  {icon:"📡",label:"API Request Sent",  detail:"POST /api/pos/earn/ → PointSphere Backend"},
  {icon:"⚙️",label:"Backend Processing",detail:"Calculating points using partner rate"},
  {icon:"🗄",label:"Database Updated",  detail:"PostgreSQL — transaction committed"},
  {icon:"✅",label:"Points Confirmed",  detail:"Customer wallet updated successfully"},
];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showFlow(title){
  document.getElementById("flowTitle").innerText=title;
  document.getElementById("flowSteps").innerHTML=STEPS.map((s,i)=>`
    <div class="fstep" id="fs${i}">
      <div class="icon">${s.icon}</div>
      <div><div class="label">${s.label}</div><div class="detail">${s.detail}</div></div>
    </div>`).join("");
  document.getElementById("flowOverlay").classList.add("show");
}
async function animateFlow(apiFn){
  let result=null;
  for(let i=0;i<STEPS.length;i++){
    const el=document.getElementById(`fs${i}`); el.classList.add("active");
    await sleep(i===2?700:450);
    if(i===2){try{result=await apiFn();}catch(e){console.error(e);}}
    el.classList.remove("active"); el.classList.add("done");
  }
  return result;
}
async function process(type){
  if(!currentCustomer) return alert("Lookup a customer first");
  const amount=parseFloat(document.getElementById("amount").value);
  if(!amount||amount<=0) return alert("Enter a valid amount");
  if(!POS_TOKEN) return alert("POS not logged in");
  const posRef=document.getElementById("posRef").value.trim()||`JH-${Date.now()}`;
  showFlow(type==="earn"?"Awarding Points...":"Redeeming Points...");
  const result=await animateFlow(async()=>{
    if(type==="earn"){
      const res=await fetch(`${API}/pos/earn/`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":POS_TOKEN},body:JSON.stringify({phone:currentCustomer.phone,amount_ksh:amount,pos_reference:posRef,note:"Java House order"})});
      const data=await res.json(); if(!res.ok) throw data; return data;
    }else{
      const pts=parseInt(prompt(`Redeem how many points?\nCustomer balance: ${currentCustomer.points} pts`));
      if(!pts||pts<=0) throw {error:"Cancelled"};
      const res=await fetch(`${API}/pos/redeem/`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":POS_TOKEN},body:JSON.stringify({phone:currentCustomer.phone,points:pts,pos_reference:posRef,note:"Java House redemption"})});
      const data=await res.json(); if(!res.ok) throw data; return data;
    }
  });
  await sleep(300);
  document.getElementById("flowOverlay").classList.remove("show");
  if(result?.success) showReceipt(type,amount,result,posRef);
  else if(result) alert("Error: "+(result.error||"Something went wrong"));
}
function showReceipt(type,amount,result,posRef){
  document.getElementById("receiptBody").innerHTML=`
    <div class="rrow"><span>Customer</span><span>${result.customer_name}</span></div>
    <div class="rrow"><span>Order Amount</span><span>KSh ${amount.toLocaleString()}</span></div>
    <div class="rrow"><span>POS Reference</span><span>${posRef}</span></div>`;
  document.getElementById("receiptPts").innerHTML=type==="earn"
    ?`<div class="pval">+${result.points_awarded} pts</div><div class="psub">Points Earned | New Balance: ${result.new_balance} pts</div>`
    :`<div class="pval" style="color:#dc2626;">-${result.points_redeemed} pts</div><div class="psub">Points Redeemed | New Balance: ${result.new_balance} pts</div>`;
  document.getElementById("receiptMeta").innerText=`${new Date().toLocaleString()} | PointSphere Loyalty`;
  document.getElementById("receiptOverlay").classList.add("show");
}
function closeReceipt(){document.getElementById("receiptOverlay").classList.remove("show");clearAll();}
</script>
</body>
</html>
